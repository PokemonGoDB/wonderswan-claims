# Check claims.json and redraw the board in README.md after every change, and once a day
# (so stale marks and newly released patches show up).
name: Board

on:
  push:
    branches: [main]
    paths: [claims.json, claim.py, titles.json]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: board

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 claim.py --local validate
      - run: python3 claim.py --local render
      - name: Commit the board
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Redraw the board" README.md
            git pull --rebase
            git push
          fi
