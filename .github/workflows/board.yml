# Check claims.json and redraw the board in README.md after every change, and once a day
# (so stale marks and newly released patches show up).
name: Board

on:
  push:
    branches: [main]
    paths: [claims.json, claim.py, titles.json]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: board

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Claims can land seconds apart, so always redraw from the newest main and try the push again if
      # another change got in first. A broken claims.json fails the run here, which emails whoever pushed it.
      - name: Check the list, redraw the board, commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 claim.py --local validate
            python3 claim.py --local render
            if git diff --quiet README.md; then exit 0; fi
            git commit -q -m "Redraw the board" README.md
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "Could not push the board after 5 attempts"
          exit 1
